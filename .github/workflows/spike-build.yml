# The spike's own build. NOT the release-path CI.
#
# 🔴 READ THIS BEFORE TREATING THIS FILE AS A PRECEDENT.
#
# ADR-012 §6.6 rule 8 says in terms that the ADR does NOT decide "the CI
# configuration itself, which is rule 14's revisit and not this ADR's" — and
# ADR-012 is still PROPOSED. So nothing here is the release-path CI, and
# nothing here binds it. What authorises this file is narrower and specific:
# the run plan's `O2`, answered 2026-10-15, which found that "GitHub's macOS
# runner *is* the Mac — free on a public repository, which is `D5`", the spike
# sitting OUTSIDE the Charter's repository set by brief §2.
#
# When the release CI is configured, it is configured against ADR-001 §8.3
# rule 14's third trigger — which ADR-012 §6.6 rule 4 says is owed at that
# ADR's acceptance and has not been made yet. Copying this file there would
# skip that.
#
# ---------------------------------------------------------------------------
# WHAT THIS PRODUCES, AND WHAT IT DOES NOT
#
# It produces an INSTALLABLE BUILD. It does not produce the figures. M7's
# scripted sequences S1–S8 run IN THE APPLICATION on the two `SyR-210`
# devices, so the figures are taken on the device after installing what this
# builds. That is the whole reason this file exists: `O2` found that
# "installing any build on a physical iPhone from CI needs a certificate and
# provisioning profile", which made the build route a blocking dependency of
# conditions 1, 2 and 5.
#
# ⚠ RELEASE CONFIGURATION, NOT DEBUG, AND THIS IS NOT A PREFERENCE. A React
# Native debug build runs with `__DEV__` true, a development bundle and the
# dev-menu machinery attached; its timings are not the application's timings.
# A p95 taken from a debug build would gate an ADR on a number that no user
# would ever see. (Ecosystem knowledge against a May 2026 cutoff, labelled as
# such per the gate-cell convention — the first run confirms it at the bench.)
#
# ⚠ AND THE PROVENANCE SCAN CANNOT RUN HERE. ADR-001 §8.3 rule 7's provenance
# list lives at `.git/provenance-forbidden.txt` and "must not live in the
# repository", so no hosted runner can ever have it. The commit-time guard is
# local-only BY DESIGN and this workflow is not its second line of defence;
# the secret-scanning half is server-side and enabled at creation.

name: spike build

on:
  # Tests on every push: they are cheap, they need no secrets, and they are
  # the thing most likely to catch a regression.
  push:
    branches: [main]
  pull_request:
  # ➕ The BUILDS are manual, deliberately. Two reasons: a device build is
  # taken when someone is about to install it, not on every push; and §7
  # rule 2 makes a changed store invalidate every figure taken on the old
  # one, so builds should be deliberate acts with a known commit.
  workflow_dispatch:
    inputs:
      android:
        description: 'Build the Android APK'
        type: boolean
        default: true
      ios:
        description: 'Build the iOS IPA (needs the signing secrets)'
        type: boolean
        default: true

# Least privilege: this workflow reads the repository and nothing else. The
# repository is PUBLIC and its history cannot be rewritten (rule 7), so a
# workflow with more rights than it needs is a standing liability.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 🔴 THE RUNNER IMAGES ARE PINNED, AND IT IS THE SAME RULE AS EVERYTHING
# ELSE HERE. `D1` pins the SQLCipher package "by name and version" because a
# p95 that gates an ADR has to be reproducible, and the README pins every
# container image for that reason too. **A floating `ubuntu-latest` is the same
# defect in a different place**: GitHub warned on 2026-10-18 that the label
# "will migrate to Ubuntu 26 beginning October 19, 2026", which would change
# the Go toolchain, the JDK and the Android SDK under the Android build
# OVERNIGHT — so Android figures taken either side of it would not be
# comparable, and nothing would have announced the change.
#
# ➕ `macos-15` was already pinned; these two were not, which was an
# oversight rather than a decision.

env:
  # `D1` pins the SQLCipher package by name and version for reproducibility;
  # the toolchain is pinned for the same reason. Node 24 because the spike's
  # TypeScript is run by Node's own strip-only loader, not compiled.
  NODE_VERSION: '24'
  # RN 0.88's Gradle build runs on JDK 17.
  JAVA_VERSION: '17'

jobs:
  # ===========================================================================
  # The logic, with leg (ii) driven against the REAL 1a server side.
  # ===========================================================================
  test:
    name: tests (incl. leg (ii) against real S3)
    runs-on: ubuntu-24.04

    services:
      # ⚠ THE PROPERTY NAMES MUST CARRY THE FULL PREFIX. s3mock 5.x binds this
      # record under @ConfigurationProperties("com.adobe.testing.s3mock.store"),
      # so the bare `initialBuckets` that s3mock's older README shows binds to
      # NOTHING — the container starts, answers ListBuckets with 200, and
      # creates no bucket, with no warning in the log. Read out of the image's
      # own StoreProperties.class, after the short form silently did nothing.
      s3:
        image: adobe/s3mock:5.2.3
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIALBUCKETS: antarii-spike-media
          COM_ADOBE_TESTING_S3MOCK_STORE_RETAINFILESONEXIT: 'false'
        ports:
          - 9090:9090

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # `npm ci` rather than `npm install`, which is the entire point of
      # tracking `package-lock.json`: the lock file is the reproducible
      # artefact and `node_modules` is disposable.
      - name: install from the lock file
        run: npm ci

      # The grant issuer is in THIS repository (`stubs-1a/`), application code
      # belonging to the codebase that needs it rather than to `antarii-dev-env`,
      # which is infrastructure only. So CI runs it directly instead of
      # building the compose service, whose context is a sibling repository
      # that a single-repository checkout does not have.
      - name: start the 1a grant issuer
        run: |
          cd stubs-1a
          go build -o /tmp/stubs-1a .
          S3_ENDPOINT=http://localhost:9090 \
          S3_BUCKET=antarii-spike-media \
          GRANT_TTL_SECONDS=60 \
          FIGURES_DIR="$RUNNER_TEMP/figures" \
          /tmp/stubs-1a &
          echo "stubs started"

      # Neither half is assumed up. s3mock carries no healthcheck of its own
      # — an earlier draft of the compose file invented a `wget` one, which a
      # Java image may not carry and which would have hung `service_healthy`
      # forever — so readiness is polled here instead.
      - name: wait for both halves of 1a
        run: |
          for i in $(seq 1 30); do
            b=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9090/antarii-spike-media || true)
            g=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz || true)
            if [ "$b" = "200" ] && [ "$g" = "200" ]; then
              echo "bucket and grant issuer both up"
              exit 0
            fi
            sleep 2
          done
          echo "1a did not come up: bucket=$b grant=$g" >&2
          # ⚠ FAIL, do not continue. The integration test SKIPS when 1a is
          # absent, by design, so that `npm test` passes on a machine with no
          # Docker — which means a silent failure here would turn leg (ii)
          # back into the unverified thing this job exists to prevent.
          exit 1

      # Run ONCE and inspect that run. ⚠ A green suite is not evidence that
      # leg (ii) ran: the integration test SKIPS when 1a is absent, by design,
      # so that `npm test` passes on a machine with no Docker. Here, where 1a
      # is up, a skip means the test silently did not run — so the skip count
      # is asserted rather than read.
      - name: run the suite, and refuse a silent skip
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-output.txt
          skipped=$(sed -n 's/^.*skipped \([0-9][0-9]*\).*$/\1/p' /tmp/test-output.txt | tail -1)
          echo "skipped=${skipped:-unknown}"
          if [ "${skipped:-1}" != "0" ]; then
            echo "a test was skipped with 1a up — leg (ii) did not run against real S3" >&2
            exit 1
          fi

  # ===========================================================================
  # Android. NO OWNER SECRETS NEEDED.
  # ===========================================================================
  android:
    name: android APK (release)
    if: github.event_name == 'workflow_dispatch' && inputs.android
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ----------------------------------------------------------------
      # 🔴 STEP 3's DE-RISK: Go → WebAssembly, compiled HERE because Go is
      # not installed on the owner's machine and must not need to be —
      # GP-009 R5 makes containers the development runtime, and CI is how
      # every other artefact in this spike is already produced.
      #
      # ⚠ ITS OWN STEP, ON PURPOSE. Step 3 carries two separable unknowns:
      # whether Go can emit a callable Wasm export, and whether the client
      # can host a Wasm runtime at all. **A failure here means the first; a
      # failure in the native build means the second**, and they cost very
      # different amounts to fix. Folding them together would lose that.
      #
      # ⚠ `go-version` is PINNED rather than left to the runner: the export
      # pragma `//go:wasmexport` needs Go 1.24 or later, and a runner that
      # happened to ship 1.22 would fail in a way that looks like the
      # pragma being wrong rather than the toolchain being old.
      # ----------------------------------------------------------------
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: compile the de-risk module to WebAssembly
        run: |
          set -euo pipefail
          mkdir -p assets
          cd wasm
          test -f go.mod || go mod init antarii/spike/wasm
          GOOS=wasip1 GOARCH=wasm go build -o ../assets/add.wasm ./...
          cd ..
          ls -l assets/add.wasm
          # ➕ The magic number is checked rather than assumed: a zero-byte or
          # non-Wasm file would otherwise reach the device and fail there,
          # which is a far more expensive place to discover it.
          head -c 4 assets/add.wasm | od -An -tx1 | tr -d ' \n' | grep -q '^0061736d' \
            || { echo 'assets/add.wasm is not a WebAssembly module'; exit 1; }
          echo 'wasm magic number ok'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - run: npm ci

      # `android/` is gitignored — continuous native generation means it is
      # build output, not source — so it is generated here each time.
      - name: expo prebuild (android)
        run: npx expo prebuild --platform android --clean

      # ➕ Signed with the debug keystore that prebuild generates, which
      # Expo's own Android template wires into the `release` buildType
      # precisely so a release variant can be run on a device. That is enough
      # to SIDELOAD onto a development phone, which is all the spike needs —
      # nothing here goes near Play, and ADR-012 §6.6 rule 5's "the key is
      # never in the repository" is satisfied trivially because there is no
      # store key in this path at all.
      # (Ecosystem knowledge, labelled: if the release variant turns out
      # unsigned, the install fails loudly and this comment is what tells the
      # next person where to look.)
      - name: assemble release
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: record what this artefact is
        run: |
          mkdir -p artefact
          cp android/app/build/outputs/apk/release/*.apk artefact/ 2>/dev/null || \
            find android -name '*.apk' -path '*release*' -exec cp {} artefact/ \;
          cat > artefact/build-provenance.json <<JSON
          {
            "platform": "android",
            "configuration": "release",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "runId": "${{ github.run_id }}",
            "note": "ADR-012 6.4 (3c) requires a build to record the release manifest's commit set. NO RELEASE MANIFEST EXISTS - ADR-001 8.3 rules 8 and 9's repository list, release manifest and synchronisation script are still unwritten, which is an open Tracker item. This records the single commit of this repository instead, which is the most this spike can honestly claim."
          }
          JSON
          ls -la artefact

      - uses: actions/upload-artifact@v4
        with:
          name: spike-android-${{ github.sha }}
          path: artefact/
          retention-days: 14

  # ===========================================================================
  # iOS. NEEDS THE OWNER'S SIGNING MATERIAL, and retains none of it.
  # ===========================================================================
  ios:
    name: iOS IPA (release, ad hoc)
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-26
    # ✅ macos-26, pinned, DECIDED BY EVIDENCE RATHER THAN HOPE.
    # The selection step below listed what macos-15 actually carries:
    # twenty Xcodes, the newest of them 26.3. Expo SDK 58 documents 26.4
    # as its minimum, so that image CANNOT build this SDK, one minor
    # version short. macos-26 ships 26.4 and 26.4.1.
    #
    # ➕ Pinned, not `macos-latest`: that label is scheduled to move to
    # macos-26 anyway, and a label that moves on someone else's schedule
    # is the same defect as `ubuntu-latest`, which changed this
    # workflow's toolchain under it once already.
    needs: test
    # 🔴 THE APPROVAL GATE ON THE SIGNING MATERIAL. The secrets below
    # live in this ENVIRONMENT, not in the repository, and the environment
    # carries required reviewers — so the distribution certificate is
    # reachable only when the owner approves that specific run.
    #
    # ➕ Why that matters more than it looks: the repository is PUBLIC, which
    # is what keeps the macOS runner and push protection free. Visibility is
    # therefore not the control; **this is**. ADR-012 §6.6 rule 5 is satisfied
    # either way — "the key is never in the repository", and an environment
    # secret is not in the repository — but rule 5 is a floor, not a ceiling.
    environment: ios-signing
    steps:
      - uses: actions/checkout@v4

      # ⚠ STOPS WITH A USEFUL MESSAGE RATHER THAN A SIGNING ERROR 20 MINUTES
      # IN. `O2`: "installing any build on a physical iPhone from CI needs a
      # certificate and provisioning profile — a separate dependency, and a
      # blocking one".
      - name: check the signing material is present
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=''
          [ -n "$CERT" ]    || missing="$missing IOS_CERTIFICATE_P12_BASE64"
          [ -n "$PROFILE" ] || missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          [ -n "$TEAM" ]    || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "iOS build cannot run. Missing repository secrets:$missing" >&2
            echo "" >&2
            echo "These are the owner's to supply and cannot be generated here." >&2
            echo "ADR-012 6.6 rule 1: the signing material is received as an" >&2
            echo "injected secret and NOTHING is retained after the build." >&2
            echo "ADR-012 6.6 rule 5: the key is never in the repository," >&2
            echo "and a second copy is held apart from the first." >&2
            echo "" >&2
            echo "This build exports AD HOC, so the certificate must be an" >&2
            echo "Apple DISTRIBUTION certificate and the profile an Ad Hoc one" >&2
            echo "carrying THE IPHONE's UDID. SyR-210 is ONE device per platform" >&2
            echo "- one Android handset and one iPhone - so there is a single" >&2
            echo "iOS UDID, not two. A Development certificate will" >&2
            echo "fail at the export step, not here." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ----------------------------------------------------------------
      # 🔴 STEP 3's DE-RISK: Go → WebAssembly, compiled HERE because Go is
      # not installed on the owner's machine and must not need to be —
      # GP-009 R5 makes containers the development runtime, and CI is how
      # every other artefact in this spike is already produced.
      #
      # ⚠ ITS OWN STEP, ON PURPOSE. Step 3 carries two separable unknowns:
      # whether Go can emit a callable Wasm export, and whether the client
      # can host a Wasm runtime at all. **A failure here means the first; a
      # failure in the native build means the second**, and they cost very
      # different amounts to fix. Folding them together would lose that.
      #
      # ⚠ `go-version` is PINNED rather than left to the runner: the export
      # pragma `//go:wasmexport` needs Go 1.24 or later, and a runner that
      # happened to ship 1.22 would fail in a way that looks like the
      # pragma being wrong rather than the toolchain being old.
      # ----------------------------------------------------------------
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: compile the de-risk module to WebAssembly
        run: |
          set -euo pipefail
          mkdir -p assets
          cd wasm
          test -f go.mod || go mod init antarii/spike/wasm
          GOOS=wasip1 GOARCH=wasm go build -o ../assets/add.wasm ./...
          cd ..
          ls -l assets/add.wasm
          # ➕ The magic number is checked rather than assumed: a zero-byte or
          # non-Wasm file would otherwise reach the device and fail there,
          # which is a far more expensive place to discover it.
          head -c 4 assets/add.wasm | od -An -tx1 | tr -d ' \n' | grep -q '^0061736d' \
            || { echo 'assets/add.wasm is not a WebAssembly module'; exit 1; }
          echo 'wasm magic number ok'

      - run: npm ci

      # 🔴 THE RUNNER DEFAULTS TO AN XCODE TOO OLD FOR THIS SDK.
      #
      # The first archive attempt died in ReactCodegen's script phase on
      # **Xcode 16.4 with the iOS 18.5 SDK**. That is not a signing fault
      # and not a code fault: **Expo SDK 58 documents a minimum of Xcode
      # 26.4**, so the toolchain was ten major versions behind the SDK and
      # the codegen phase was simply the first thing to break.
      #
      # ➕ This DISCOVERS what the image carries rather than hard-coding a
      # path, because a pinned `/Applications/Xcode_26.4.app` would break
      # silently the day the image changes -- the same floating-version
      # defect as `ubuntu-latest`, which bit this workflow once already.
      #
      # ⚠ And if nothing suitable exists it FAILS WITH THE LIST, so one run
      # tells us whether to move to a newer runner label instead of leaving
      # us guessing from a codegen error ten steps downstream.
      - name: select an Xcode new enough for Expo SDK 58
        run: |
          set -eu
          # ⚠ awk, not `head`: `head` closes the pipe after one line and
          # xcodebuild dies writing to it, spraying an NSException stack trace
          # through the log. Harmless, but it looks exactly like a real crash.
          echo "default before selection: $(xcodebuild -version | awk 'NR==1')"
          echo "installed Xcodes:"
          best=""; best_n=0; best_v=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            v=$(/usr/bin/defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null) || continue
            maj=${v%%.*}
            case "$v" in *.*) rest=${v#*.}; min=${rest%%.*} ;; *) min=0 ;; esac
            case "$maj" in ''|*[!0-9]*) continue ;; esac
            case "$min" in ''|*[!0-9]*) min=0 ;; esac
            n=$(( maj * 1000 + min ))
            echo "  $v  $app"
            if [ "$n" -gt "$best_n" ]; then best_n=$n; best="$app"; best_v="$v"; fi
          done
          # 26.4 -> 26 * 1000 + 4
          if [ "$best_n" -lt 26004 ]; then
            echo "" >&2
            echo "No Xcode >= 26.4 on this runner (best found: ${best_v:-none})." >&2
            echo "Expo SDK 58 documents 26.4 as its minimum, so this image" >&2
            echo "cannot build it. Move the ios job to a newer runner label" >&2
            echo "(for example macos-26) rather than pinning an Xcode path." >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$best/Contents/Developer" >> "$GITHUB_ENV"
          echo "selected: $best_v  ($best)"
      
      - name: expo prebuild (ios)
        run: npx expo prebuild --platform ios --clean

      # A keychain created for this job and destroyed in the cleanup step
      # below, which runs `if: always()`. That pairing IS rule 1's "retain
      # nothing after the build" — the default login keychain is never
      # touched, so there is nothing left to leak if the job fails midway.
      - name: import the signing material into a throwaway keychain
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/spike-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # 🔴 WHY THIS IS NOT JUST `base64 --decode`.
          # The first real run died here with "error decoding base64 input
          # stream", because the secret had been produced on Windows with
          #     [Convert]::ToBase64String(...) > file.txt
          # and PowerShell's `>` writes a UTF-8 BOM. Three invisible bytes at
          # the front, none of them valid base64. Measured, not guessed: that
          # redirect produced 405 bytes where the base64 was 400.
          #
          # ➕ So the decode now DISCARDS anything outside the base64 alphabet
          # -- a BOM, newlines, stray spaces from a copy-paste -- and then
          # proves the result is really a DER blob rather than trusting that
          # it decoded to something. It also reports how many characters it
          # had to strip, which is the tell for a mangled secret.
          #
          # ⚠ It prints LENGTHS ONLY. Nothing here may echo a secret.
          decode_secret() {
            python3 - "$1" "$2" "$3" <<'DECODE'
          import base64, os, re, sys
          var, out, human = sys.argv[1], sys.argv[2], sys.argv[3]
          raw = os.environ.get(var, "")
          clean = re.sub(r"[^A-Za-z0-9+/=]", "", raw)
          stripped = len(raw) - len(clean)
          if not clean:
              sys.exit(human + ": the secret is empty once non-base64 characters are removed")
          try:
              data = base64.b64decode(clean, validate=True)
          except Exception as e:
              sys.exit(human + ": still not valid base64 after cleaning (" + str(e) + ")")
          if len(data) < 256:
              sys.exit(human + ": decoded to only %d bytes from %d base64 characters. "
             "A real .p12 is about 2.5-4 KB and a profile about 8-12 KB, so this is "
             "not the file -- it is roughly the length of a PATH or a single line of "
             "text. Check you pasted the base64 ITSELF, not a filename, a path, or one "
             "line of a wrapped file." % (len(data), len(clean)))
          if data[0] != 0x30:
              sys.exit(human + ": decoded, but does not start with a DER SEQUENCE (0x%02x). "
                       "The secret is base64 of the wrong thing -- perhaps a .cer, a .pem, "
                       "or the text of a file rather than its bytes." % data[0])
          open(out, "wb").write(data)
          print("%s: %d bytes, %d non-base64 characters stripped" % (human, len(data), stripped))
          DECODE
          }
          
          decode_secret CERT "$RUNNER_TEMP/cert.p12" "the certificate (.p12)"
          # ⚠ THE ERROR THIS GUARD EXISTS FOR IS ACTIVELY MISLEADING.
          # OpenSSL 3 writes PKCS#12 with AES-256-CBC and a SHA-256 MAC,
          # which older macOS cannot read, and the failure reads "MAC
          # verification failed ... (wrong password?)" — so the obvious
          # response is to go and check the password, which is careful,
          # correct, and loses the build to the wrong suspect.
          if ! security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN"  -P "$CERT_PASSWORD" -T /usr/bin/codesign; then
            echo "" >&2
            echo "The .p12 could not be imported." >&2
            echo "" >&2
            echo "If the message mentioned MAC verification or a wrong" >&2
            echo "password, SUSPECT THE ALGORITHM BEFORE THE PASSWORD:" >&2
            echo "re-export the .p12 adding OpenSSL's -legacy flag --" >&2
            echo "  openssl pkcs12 -export -legacy -inkey KEY -in CERT.pem -out spike.p12" >&2
            echo "-- then update IOS_CERTIFICATE_P12_BASE64. See the README." >&2
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          # The p12 is gone the moment it is imported; only the keychain
          # holds it, and the keychain is deleted below.
          rm -f "$RUNNER_TEMP/cert.p12"

          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          decode_secret PROFILE "$PROFILES/spike.mobileprovision" "the provisioning profile"

          # ➕ READ the profile's name and the identity, rather than guessing
          # either. Manual signing needs PROVISIONING_PROFILE_SPECIFIER, and
          # the specifier is the profile's own Name — which only the profile
          # knows. A guessed name is a 20-minute failure at the archive step.
          security cms -D -i "$PROFILES/spike.mobileprovision" \
            -o "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          SIGN_ID=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)
          rm -f "$RUNNER_TEMP/profile.plist"
          [ -n "$PROFILE_NAME" ] || { echo "profile has no Name" >&2; exit 1; }
          [ -n "$SIGN_ID" ] || { echo "no codesigning identity imported" >&2; exit 1; }
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "SIGN_ID=$SIGN_ID" >> "$GITHUB_ENV"
          # ✕ Deliberately NOT echoed in full: the identity names the
          # certificate. The profile name is safe and is the useful half.
          echo "profile: $PROFILE_NAME"

      # ➕ The scheme is DISCOVERED, not assumed. `expo prebuild` names the
      # Xcode project after the app, and hard-coding a guessed name is the
      # kind of thing that fails on the first run for no good reason.
      - name: find the workspace and scheme
        run: |
          WS=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          [ -n "$WS" ] || { echo "no .xcworkspace after prebuild" >&2; exit 1; }
          SCHEME=$(xcodebuild -workspace "$WS" -list \
            | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')
          [ -n "$SCHEME" ] || { echo "no scheme in $WS" >&2; exit 1; }
          echo "WS=$WS" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "workspace=$WS scheme=$SCHEME"

      - name: archive (Release)
        run: |
          xcodebuild -workspace "$WS" -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/spike.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="$SIGN_ID" \
            archive

      # ✅ AD HOC, AND THE CHOICE IS NOW DECIDED (owner, 2026-10-18).
      #
      # A correction is recorded here because this comment previously cited
      # `D5` for "a separately revocable development identity, the
      # distribution certificate never leaving the owner's keychain".
      # ✕ **`D5` is the spike REPOSITORY**, not a signing identity, and that
      # discipline is not written anywhere in the corpus. It may have been
      # said and never recorded, or it may have been invented here; either
      # way it is not a citable rule and is not cited.
      #
      # The VERIFIED constraint is ADR-012 §6.6 rule 5: "the key is never in
      # the repository" and "a second copy is held apart from the first" —
      # which a CI secret does not breach.
      #
      # ✅ The route is over-the-air, so an Ad Hoc profile and therefore an
      # Apple DISTRIBUTION certificate. The owner accepted that on rule 5's
      # own reasoning: its harm is "a new application identity in the store"
      # and nothing is published, so a compromise is revoke-and-reissue.
      # ➕ The Mac alternative died twice over — the owner's 2019 Intel Mac
      # does not boot, and a cloud Mac cannot help because installing needs a
      # physical USB connection to the phone.
      - name: export the IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <!-- ✅ ad-hoc, DECIDED BY THE OWNER 2026-10-18 after the probe
                 confirmed the over-the-air route. An Ad Hoc profile is what
                 an itms-services install needs, and it requires an Apple
                 DISTRIBUTION certificate — accepted because ADR-012 §6.6
                 rule 5's stated harm is "a new application identity in the
                 store" and nothing is published, so a compromise is
                 revoke-and-reissue rather than unrepairable. -->
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.smartbitit.antarii.spike</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/spike.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: record what this artefact is
        run: |
          mkdir -p artefact
          cp "$RUNNER_TEMP/export"/*.ipa artefact/
          cat > artefact/build-provenance.json <<JSON
          {
            "platform": "ios",
            "configuration": "Release",
            "signing": "ad hoc, Apple Distribution certificate - installs only on the registered device UDIDs",
            "installRoute": "over the air, itms-services manifest served from GitHub Pages",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "runId": "${{ github.run_id }}",
            "note": "ADR-012 6.4 (3c) requires a build to record the release manifest's commit set. NO RELEASE MANIFEST EXISTS - ADR-001 8.3 rules 8 and 9's artefacts are still unwritten, an open Tracker item. This records this repository's single commit instead."
          }
          JSON
          ls -la artefact

      - uses: actions/upload-artifact@v4
        with:
          name: spike-ios-${{ github.sha }}
          path: artefact/
          retention-days: 14

      # 🔴 RULE 1's SECOND HALF, and it runs even when the build fails.
      # "receive the signing material as an injected secret and RETAIN
      # NOTHING AFTER THE BUILD". A cleanup that only ran on success would
      # leave the key on a failed run, which is the run it matters on.
      - name: destroy the signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/spike.mobileprovision"
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "throwaway keychain and profile removed"

  # ===========================================================================
  # Publish the iOS build for an over-the-air install.
  #
  # ✅ THE ROUTE, CONFIRMED BY PROBE 2026-10-18: GitHub Pages serves an
  # itms-services manifest that iOS accepts — and it accepts it as
  # `application/octet-stream`, which the vendor sources said would be refused
  # silently. They were wrong, and the probe is why we know rather than guess.
  #
  # 🔴 NOTHING ENTERS GIT HISTORY. Pages is deployed BY ACTIONS from an
  # artefact, so the `.ipa` is never committed — which is what keeps the
  # repository's own `*.ipa` ignore rule intact. That rule exists because this
  # history cannot be rewritten (ADR-001 §8.3 rule 7), so a committed build
  # would be a delete-and-recreate problem rather than a tidying one.
  #
  # ➕ A SEPARATE JOB ON UBUNTU, not steps on the macOS runner, for three
  # reasons: macOS minutes are the expensive ones and this needs none of them;
  # the Pages permissions stay scoped to the single job that needs them; and
  # the signing material is already destroyed by the time this runs.
  # ===========================================================================
  publish-ota:
    name: publish for over-the-air install
    needs: ios
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: spike-ios-${{ github.sha }}
          path: incoming

      - name: configure pages
        id: pages
        uses: actions/configure-pages@v5

      - name: build the install site
        env:
          BASE: ${{ steps.pages.outputs.base_url }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -eu

          # ⚠ NORMALISE THE BASE URL. `configure-pages` returns it WITHOUT a
          # trailing slash, and the probe's first run concatenated host and
          # filename into a 404 — which on the phone looked exactly like iOS
          # refusing the manifest, i.e. the negative result the probe existed
          # to detect. Stripping then re-adding is correct whichever form the
          # action returns.
          BASE="${BASE%/}/"
          echo "base: $BASE"

          mkdir -p site
          cp incoming/*.ipa site/app.ipa
          cp incoming/build-provenance.json site/build-provenance.json

          # 🔴 THE BUNDLE IDENTIFIER AND VERSION COME FROM `app.json`, NOT FROM
          # A LITERAL. iOS decides whether this install REPLACES the installed
          # app by the manifest's bundle-identifier — so a literal that drifted
          # from the app would make N+1 a second app rather than an update, and
          # leg (iii) measures exactly that update. `build.test.ts` holds
          # `app.json` and `src/build.ts` to each other, so this is the single
          # source of truth for both.
          BUNDLE_ID=$(node -e "console.log(require('./app.json').expo.ios.bundleIdentifier)")
          VERSION=$(node -e "console.log(require('./app.json').expo.version)")
          RUNTIME=$(node -e "console.log(require('./app.json').expo.runtimeVersion)")
          echo "bundle: $BUNDLE_ID  version: $VERSION  runtime: $RUNTIME"

          # Placeholder install artwork. ➕ These are only the tile iOS draws
          # WHILE installing; the app's real icon comes from inside the bundle,
          # so a placeholder costs nothing and avoids inventing an icon the
          # project has not designed.
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==' | base64 -d > site/icon57.png
          cp site/icon57.png site/icon512.png

          cat > site/manifest.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key><string>software-package</string>
                    <key>url</key><string>${BASE}app.ipa</string>
                  </dict>
                  <dict>
                    <key>kind</key><string>display-image</string>
                    <key>url</key><string>${BASE}icon57.png</string>
                  </dict>
                  <dict>
                    <key>kind</key><string>full-size-image</string>
                    <key>url</key><string>${BASE}icon512.png</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key><string>${BUNDLE_ID}</string>
                  <key>bundle-version</key><string>${VERSION}</string>
                  <key>kind</key><string>software</string>
                  <key>title</key><string>Antarii Spike</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

          cat > site/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Antarii Spike install</title>
            <style>
              :root { color-scheme: light dark; }
              body { font: 17px/1.5 -apple-system, system-ui, sans-serif; margin: 0; padding: 24px; }
              a.btn { display: block; padding: 18px; margin: 16px 0; border: 2px solid #595959;
                      border-radius: 8px; text-align: center; text-decoration: none;
                      font-weight: 600; color: inherit; }
              dl { font-size: 15px; } dt { font-weight: 600; margin-top: 8px; }
              dd { margin: 0; } code { word-break: break-all; }
            </style>
          </head>
          <body>
            <h1>Antarii Spike</h1>
            <a class="btn" href="itms-services://?action=download-manifest&amp;url=${BASE}manifest.plist">
              Install on this iPhone
            </a>
            <p>Installs only on the device UDIDs registered in the Ad Hoc profile.
            Afterwards, trust the developer under
            <em>Settings &rsaquo; General &rsaquo; VPN &amp; Device Management</em>.</p>
            <dl>
              <dt>version</dt><dd>${VERSION} (runtime ${RUNTIME})</dd>
              <dt>commit</dt><dd><code>${SHA}</code></dd>
              <dt>run</dt><dd><code>${RUN_ID}</code></dd>
            </dl>
          </body>
          </html>
          HTML

          # Fail loudly here rather than publish something iOS rejects quietly.
          python3 - <<'CHECK'
          import plistlib
          d = plistlib.load(open('site/manifest.plist', 'rb'))
          item = d['items'][0]
          assert item['metadata']['bundle-identifier'], 'no bundle-identifier'
          assert item['metadata']['bundle-version'], 'no bundle-version'
          assert any(a['kind'] == 'software-package' for a in item['assets']), 'no package asset'
          for a in item['assets']:
              assert a['url'].startswith('https://'), 'asset url is not https: ' + a['url']
              assert '//' not in a['url'][8:], 'double slash in ' + a['url']
          print('manifest OK:', item['metadata']['bundle-identifier'], item['metadata']['bundle-version'])
          CHECK
          ls -la site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: the install link
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## Install on the iPhone"
            echo ""
            echo "Open this on each phone and tap **Install on this iPhone**:"
            echo ""
            echo "### $URL"
            echo ""
            echo "- Installs only on UDIDs registered in the Ad Hoc profile."
            echo "- Then trust the developer: Settings > General > VPN & Device Management."
            echo ""
            echo "> The build stays publicly downloadable while Pages serves it."
            echo "> It holds no private key - it exposes the team id and the registered"
            echo "> UDIDs, and installs nowhere else. Run **OTA teardown** when finished."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "install from: $URL"

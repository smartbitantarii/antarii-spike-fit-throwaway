# The spike's own build. NOT the release-path CI.
#
# 🔴 READ THIS BEFORE TREATING THIS FILE AS A PRECEDENT.
#
# ADR-012 §6.6 rule 8 says in terms that the ADR does NOT decide "the CI
# configuration itself, which is rule 14's revisit and not this ADR's" — and
# ADR-012 is still PROPOSED. So nothing here is the release-path CI, and
# nothing here binds it. What authorises this file is narrower and specific:
# the run plan's `O2`, answered 2026-10-15, which found that "GitHub's macOS
# runner *is* the Mac — free on a public repository, which is `D5`", the spike
# sitting OUTSIDE the Charter's repository set by brief §2.
#
# When the release CI is configured, it is configured against ADR-001 §8.3
# rule 14's third trigger — which ADR-012 §6.6 rule 4 says is owed at that
# ADR's acceptance and has not been made yet. Copying this file there would
# skip that.
#
# ---------------------------------------------------------------------------
# WHAT THIS PRODUCES, AND WHAT IT DOES NOT
#
# It produces an INSTALLABLE BUILD. It does not produce the figures. M7's
# scripted sequences S1–S8 run IN THE APPLICATION on the two `SyR-210`
# devices, so the figures are taken on the device after installing what this
# builds. That is the whole reason this file exists: `O2` found that
# "installing any build on a physical iPhone from CI needs a certificate and
# provisioning profile", which made the build route a blocking dependency of
# conditions 1, 2 and 5.
#
# ⚠ RELEASE CONFIGURATION, NOT DEBUG, AND THIS IS NOT A PREFERENCE. A React
# Native debug build runs with `__DEV__` true, a development bundle and the
# dev-menu machinery attached; its timings are not the application's timings.
# A p95 taken from a debug build would gate an ADR on a number that no user
# would ever see. (Ecosystem knowledge against a May 2026 cutoff, labelled as
# such per the gate-cell convention — the first run confirms it at the bench.)
#
# ⚠ AND THE PROVENANCE SCAN CANNOT RUN HERE. ADR-001 §8.3 rule 7's provenance
# list lives at `.git/provenance-forbidden.txt` and "must not live in the
# repository", so no hosted runner can ever have it. The commit-time guard is
# local-only BY DESIGN and this workflow is not its second line of defence;
# the secret-scanning half is server-side and enabled at creation.

name: spike build

on:
  # Tests on every push: they are cheap, they need no secrets, and they are
  # the thing most likely to catch a regression.
  push:
    branches: [main]
  pull_request:
  # ➕ The BUILDS are manual, deliberately. Two reasons: a device build is
  # taken when someone is about to install it, not on every push; and §7
  # rule 2 makes a changed store invalidate every figure taken on the old
  # one, so builds should be deliberate acts with a known commit.
  workflow_dispatch:
    inputs:
      android:
        description: 'Build the Android APK'
        type: boolean
        default: true
      ios:
        description: 'Build the iOS IPA (needs the signing secrets)'
        type: boolean
        default: true

# Least privilege: this workflow reads the repository and nothing else. The
# repository is PUBLIC and its history cannot be rewritten (rule 7), so a
# workflow with more rights than it needs is a standing liability.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `D1` pins the SQLCipher package by name and version for reproducibility;
  # the toolchain is pinned for the same reason. Node 24 because the spike's
  # TypeScript is run by Node's own strip-only loader, not compiled.
  NODE_VERSION: '24'
  # RN 0.88's Gradle build runs on JDK 17.
  JAVA_VERSION: '17'

jobs:
  # ===========================================================================
  # The logic, with leg (ii) driven against the REAL 1a server side.
  # ===========================================================================
  test:
    name: tests (incl. leg (ii) against real S3)
    runs-on: ubuntu-latest

    services:
      # ⚠ THE PROPERTY NAMES MUST CARRY THE FULL PREFIX. s3mock 5.x binds this
      # record under @ConfigurationProperties("com.adobe.testing.s3mock.store"),
      # so the bare `initialBuckets` that s3mock's older README shows binds to
      # NOTHING — the container starts, answers ListBuckets with 200, and
      # creates no bucket, with no warning in the log. Read out of the image's
      # own StoreProperties.class, after the short form silently did nothing.
      s3:
        image: adobe/s3mock:5.2.3
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIALBUCKETS: antarii-spike-media
          COM_ADOBE_TESTING_S3MOCK_STORE_RETAINFILESONEXIT: 'false'
        ports:
          - 9090:9090

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # `npm ci` rather than `npm install`, which is the entire point of
      # tracking `package-lock.json`: the lock file is the reproducible
      # artefact and `node_modules` is disposable.
      - name: install from the lock file
        run: npm ci

      # The grant issuer is in THIS repository (`stubs-1a/`), application code
      # belonging to the codebase that needs it rather than to `antarii-dev-env`,
      # which is infrastructure only. So CI runs it directly instead of
      # building the compose service, whose context is a sibling repository
      # that a single-repository checkout does not have.
      - name: start the 1a grant issuer
        run: |
          cd stubs-1a
          go build -o /tmp/stubs-1a .
          S3_ENDPOINT=http://localhost:9090 \
          S3_BUCKET=antarii-spike-media \
          GRANT_TTL_SECONDS=60 \
          /tmp/stubs-1a &
          echo "stubs started"

      # Neither half is assumed up. s3mock carries no healthcheck of its own
      # — an earlier draft of the compose file invented a `wget` one, which a
      # Java image may not carry and which would have hung `service_healthy`
      # forever — so readiness is polled here instead.
      - name: wait for both halves of 1a
        run: |
          for i in $(seq 1 30); do
            b=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9090/antarii-spike-media || true)
            g=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz || true)
            if [ "$b" = "200" ] && [ "$g" = "200" ]; then
              echo "bucket and grant issuer both up"
              exit 0
            fi
            sleep 2
          done
          echo "1a did not come up: bucket=$b grant=$g" >&2
          # ⚠ FAIL, do not continue. The integration test SKIPS when 1a is
          # absent, by design, so that `npm test` passes on a machine with no
          # Docker — which means a silent failure here would turn leg (ii)
          # back into the unverified thing this job exists to prevent.
          exit 1

      # Run ONCE and inspect that run. ⚠ A green suite is not evidence that
      # leg (ii) ran: the integration test SKIPS when 1a is absent, by design,
      # so that `npm test` passes on a machine with no Docker. Here, where 1a
      # is up, a skip means the test silently did not run — so the skip count
      # is asserted rather than read.
      - name: run the suite, and refuse a silent skip
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-output.txt
          skipped=$(sed -n 's/^.*skipped \([0-9][0-9]*\).*$/\1/p' /tmp/test-output.txt | tail -1)
          echo "skipped=${skipped:-unknown}"
          if [ "${skipped:-1}" != "0" ]; then
            echo "a test was skipped with 1a up — leg (ii) did not run against real S3" >&2
            exit 1
          fi

  # ===========================================================================
  # Android. NO OWNER SECRETS NEEDED.
  # ===========================================================================
  android:
    name: android APK (release)
    if: github.event_name == 'workflow_dispatch' && inputs.android
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - run: npm ci

      # `android/` is gitignored — continuous native generation means it is
      # build output, not source — so it is generated here each time.
      - name: expo prebuild (android)
        run: npx expo prebuild --platform android --clean

      # ➕ Signed with the debug keystore that prebuild generates, which
      # Expo's own Android template wires into the `release` buildType
      # precisely so a release variant can be run on a device. That is enough
      # to SIDELOAD onto a development phone, which is all the spike needs —
      # nothing here goes near Play, and ADR-012 §6.6 rule 5's "the key is
      # never in the repository" is satisfied trivially because there is no
      # store key in this path at all.
      # (Ecosystem knowledge, labelled: if the release variant turns out
      # unsigned, the install fails loudly and this comment is what tells the
      # next person where to look.)
      - name: assemble release
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: record what this artefact is
        run: |
          mkdir -p artefact
          cp android/app/build/outputs/apk/release/*.apk artefact/ 2>/dev/null || \
            find android -name '*.apk' -path '*release*' -exec cp {} artefact/ \;
          cat > artefact/build-provenance.json <<JSON
          {
            "platform": "android",
            "configuration": "release",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "runId": "${{ github.run_id }}",
            "note": "ADR-012 6.4 (3c) requires a build to record the release manifest's commit set. NO RELEASE MANIFEST EXISTS - ADR-001 8.3 rules 8 and 9's repository list, release manifest and synchronisation script are still unwritten, which is an open Tracker item. This records the single commit of this repository instead, which is the most this spike can honestly claim."
          }
          JSON
          ls -la artefact

      - uses: actions/upload-artifact@v4
        with:
          name: spike-android-${{ github.sha }}
          path: artefact/
          retention-days: 14

  # ===========================================================================
  # iOS. NEEDS THE OWNER'S SIGNING MATERIAL, and retains none of it.
  # ===========================================================================
  ios:
    name: iOS IPA (release)
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v4

      # ⚠ STOPS WITH A USEFUL MESSAGE RATHER THAN A SIGNING ERROR 20 MINUTES
      # IN. `O2`: "installing any build on a physical iPhone from CI needs a
      # certificate and provisioning profile — a separate dependency, and a
      # blocking one".
      - name: check the signing material is present
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=''
          [ -n "$CERT" ]    || missing="$missing IOS_CERTIFICATE_P12_BASE64"
          [ -n "$PROFILE" ] || missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          [ -n "$TEAM" ]    || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "iOS build cannot run. Missing repository secrets:$missing" >&2
            echo "" >&2
            echo "These are the owner's to supply and cannot be generated here." >&2
            echo "ADR-012 6.6 rule 1: the signing material is received as an" >&2
            echo "injected secret and NOTHING is retained after the build." >&2
            echo "ADR-012 6.6 rule 5: the key is never in the repository," >&2
            echo "and a second copy is held apart from the first." >&2
            echo "" >&2
            echo "WHICH identity to use is OPEN - see the install-route item." >&2
            echo "An Ad Hoc or App Store profile needs an Apple DISTRIBUTION" >&2
            echo "certificate; only a Development profile uses a development" >&2
            echo "one, and that route needs a Mac to install from." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - name: expo prebuild (ios)
        run: npx expo prebuild --platform ios --clean

      # A keychain created for this job and destroyed in the cleanup step
      # below, which runs `if: always()`. That pairing IS rule 1's "retain
      # nothing after the build" — the default login keychain is never
      # touched, so there is nothing left to leak if the job fails midway.
      - name: import the signing material into a throwaway keychain
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/spike-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          # The p12 is gone the moment it is imported; only the keychain
          # holds it, and the keychain is deleted below.
          rm -f "$RUNNER_TEMP/cert.p12"

          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          printf '%s' "$PROFILE" | base64 --decode > "$PROFILES/spike.mobileprovision"

          # ➕ READ the profile's name and the identity, rather than guessing
          # either. Manual signing needs PROVISIONING_PROFILE_SPECIFIER, and
          # the specifier is the profile's own Name — which only the profile
          # knows. A guessed name is a 20-minute failure at the archive step.
          security cms -D -i "$PROFILES/spike.mobileprovision" \
            -o "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          SIGN_ID=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)
          rm -f "$RUNNER_TEMP/profile.plist"
          [ -n "$PROFILE_NAME" ] || { echo "profile has no Name" >&2; exit 1; }
          [ -n "$SIGN_ID" ] || { echo "no codesigning identity imported" >&2; exit 1; }
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "SIGN_ID=$SIGN_ID" >> "$GITHUB_ENV"
          # ✕ Deliberately NOT echoed in full: the identity names the
          # certificate. The profile name is safe and is the useful half.
          echo "profile: $PROFILE_NAME"

      # ➕ The scheme is DISCOVERED, not assumed. `expo prebuild` names the
      # Xcode project after the app, and hard-coding a guessed name is the
      # kind of thing that fails on the first run for no good reason.
      - name: find the workspace and scheme
        run: |
          WS=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          [ -n "$WS" ] || { echo "no .xcworkspace after prebuild" >&2; exit 1; }
          SCHEME=$(xcodebuild -workspace "$WS" -list \
            | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')
          [ -n "$SCHEME" ] || { echo "no scheme in $WS" >&2; exit 1; }
          echo "WS=$WS" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "workspace=$WS scheme=$SCHEME"

      - name: archive (Release)
        run: |
          xcodebuild -workspace "$WS" -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/spike.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="$SIGN_ID" \
            archive

      # ⚠ `development` IS PROVISIONAL AND THE CHOICE IS OPEN.
      #
      # A correction is recorded here because this comment previously cited
      # `D5` for "a separately revocable development identity, the
      # distribution certificate never leaving the owner's keychain".
      # ✕ **`D5` is the spike REPOSITORY**, not a signing identity, and that
      # discipline is not written anywhere in the corpus. It may have been
      # said and never recorded, or it may have been invented here; either
      # way it is not a citable rule and is not cited.
      #
      # The VERIFIED constraint is ADR-012 §6.6 rule 5: "the key is never in
      # the repository" and "a second copy is held apart from the first" —
      # which a CI secret does not breach.
      #
      # ⚠ And the choice has a cost either way: **an Ad Hoc profile, which
      # is what an over-the-air install needs, requires an Apple
      # DISTRIBUTION certificate**, as does TestFlight. Only a Development
      # profile uses a development certificate, and installing one needs a
      # Mac. `development` stands here until the install route is decided.
      - name: export the IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.antarii.spike</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/spike.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: record what this artefact is
        run: |
          mkdir -p artefact
          cp "$RUNNER_TEMP/export"/*.ipa artefact/
          cat > artefact/build-provenance.json <<JSON
          {
            "platform": "ios",
            "configuration": "Release",
            "signing": "development profile (provisional - install route undecided)",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "runId": "${{ github.run_id }}",
            "note": "ADR-012 6.4 (3c) requires a build to record the release manifest's commit set. NO RELEASE MANIFEST EXISTS - ADR-001 8.3 rules 8 and 9's artefacts are still unwritten, an open Tracker item. This records this repository's single commit instead."
          }
          JSON
          ls -la artefact

      - uses: actions/upload-artifact@v4
        with:
          name: spike-ios-${{ github.sha }}
          path: artefact/
          retention-days: 14

      # 🔴 RULE 1's SECOND HALF, and it runs even when the build fails.
      # "receive the signing material as an injected secret and RETAIN
      # NOTHING AFTER THE BUILD". A cleanup that only ran on success would
      # leave the key on a failed run, which is the run it matters on.
      - name: destroy the signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/spike.mobileprovision"
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "throwaway keychain and profile removed"
